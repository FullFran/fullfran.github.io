<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador de la molécula H₂⁺ en un universo plano</title>
<style>
:root{--bg:#1a1b26;--panel:#16161e;--ink:#a9b1d6;--strong:#c0caf5;--muted:#828bb8;--line:#292e42;
  --accent:#7aa2f7;--good:#9ece6a;--bad:#f7768e;--cloud:#bb9af7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
.wrap{max-width:920px;margin:0 auto;padding:14px;display:grid;grid-template-columns:270px 1fr;gap:14px}
@media (max-width:700px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.controls{display:flex;flex-direction:column;gap:16px}
.lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.val{font-family:ui-monospace,Menlo,monospace;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;border:1px solid #3b4261;border-radius:4px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13.5px;background:transparent;color:var(--muted);border:0;padding:6px 0;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#16161e;font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.out{font-size:14px;line-height:1.5}
.out .big{font-family:ui-monospace,Menlo,monospace;font-size:22px;color:var(--strong)}
.verdict{font-weight:600}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
canvas{width:100%;display:block}
#scene{height:90px} #plot{height:clamp(240px,42vw,380px)}
.legend{font-size:12.5px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend i.dash{border-top-style:dashed;border-color:#ff9e64}
.legend i.dot{width:9px;height:9px;border:0;border-radius:50%;background:var(--strong)}
.right{display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel controls">
    <div>
      <div class="lab">Curvatura del universo</div>
      <div class="seg" id="cases" role="group" aria-label="Curvatura"></div>
    </div>
    <div>
      <div class="lab"><label for="R">Distancia entre protones R</label><span class="val" id="Rv"></span></div>
      <input type="range" id="R" min="0" step="1">
    </div>
    <div>
      <div class="lab"><label for="d">Desplazamiento del electrón d</label><span class="val" id="dv"></span></div>
      <input type="range" id="d" min="0" step="1">
    </div>
    <label class="chk"><input type="checkbox" id="best"> Pon el electrón en su mejor sitio</label>
    <div class="out">
      <div>ΔE respecto a átomo + protón suelto</div>
      <div class="big" id="dE" aria-live="polite"></div>
      <div class="verdict" id="verdict"></div>
    </div>
  </div>
  <div class="right">
    <div class="panel"><canvas id="scene" aria-label="Esquema: dos protones a distancia R y la nube del electrón desplazada una distancia d"></canvas></div>
    <div class="panel">
      <canvas id="plot" aria-label="Curvas de ΔE frente a R: con el electrón a medio camino y con el electrón en su mejor sitio"></canvas>
      <div class="legend"><span><i class="dash"></i>electrón a medio camino (d = R/2)</span><span><i></i>electrón en su mejor sitio</span><span><i class="dot"></i>tu configuración</span></div>
    </div>
  </div>
</div>

  else { d = T.f[jf] * R; val = dE(c, iR, jf); }
  $('Rv').textContent = fmt(R, 2) + ' a'; $('dv').textContent = fmt(d, 2) + ' a';
  $('dE').textContent = (Math.abs(val) < 1e-3 && val !== 0 ? sci(val) : fmt(val, 5)) + ' g';
  const v = $('verdict');
  if (val < 0) { v.textContent = 'Más baja que separados: la molécula se mantiene'; v.className = 'verdict good'; }
  else { v.textContent = 'Más alta que separados: así no hay enlace'; v.className = 'verdict bad'; }
  scene(R, d); plot(c, R, val);
}
Rin.oninput = din.oninput = best.onchange = update;
window.addEventListener('resize', update);
update();
</script>
