<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Órbitas en tres y en dos dimensiones</title>
<style>
:root{--bg:#1a1b26;--panel:#16161e;--ink:#a9b1d6;--strong:#c0caf5;--muted:#828bb8;--line:#292e42;
  --kep:#ff9e64;--log:#7aa2f7;--sun:#f7768e;--accent:#7aa2f7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
figcaption{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
figcaption b{color:var(--strong);font-weight:600}
canvas{width:100%;aspect-ratio:1/1;display:block}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap;font-size:14px}
button{font:inherit;background:var(--line);color:var(--strong);border:1px solid #3b4261;border-radius:4px;padding:6px 14px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <figure><canvas id="kep" aria-label="Órbita en nuestro mundo, fuerza uno sobre r al cuadrado: una elipse que se cierra"></canvas>
      <figcaption><b>Nuestro mundo</b> · fuerza 1/r²</figcaption></figure>
    <figure><canvas id="log" aria-label="Órbita en un mundo plano, fuerza uno sobre r: una roseta que no se cierra"></canvas>
      <figcaption><b>Mundo plano</b> · fuerza 1/r</figcaption></figure>
  </div>
  <div class="bar">
    <button id="play" type="button">Pausa</button>
    <button id="reset" type="button">Reiniciar</button>
    <span id="turn" aria-live="polite"></span>
  </div>
  <p class="note">Mismo empujón inicial en los dos: un <span id="kick"></span> más de velocidad que la órbita circular. Trayectorias calculadas de antemano integrando las ecuaciones de Newton.</p>
</div>
